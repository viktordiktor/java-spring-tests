# ============================================================
# API
# ============================================================
api.baseUri=${API_BASE_URI:https://shawarma.threadqa.ru/api/v1}
api.loginPath=/auth/login

# ============================================================
# Credentials
# Defaults point to the public demo stand.
# Override them in CI with TEST_USERNAME / TEST_PASSWORD.
# ============================================================
credentials.username=${TEST_USERNAME:owner}
credentials.password=${TEST_PASSWORD:owner123}

# ============================================================
# Selenide (UI)
# Any value can be overridden by an environment variable
# or a system property, e.g. -Dselenide.headless=true
# ============================================================
selenide.baseUrl=${SELENIDE_BASE_URL:https://shawarma.threadqa.ru}
selenide.browser=${SELENIDE_BROWSER:chrome}
selenide.headless=${SELENIDE_HEADLESS:false}
selenide.timeout=${SELENIDE_TIMEOUT:10000}
selenide.pageLoadTimeout=${SELENIDE_PAGE_LOAD_TIMEOUT:30000}
selenide.browserSize=${SELENIDE_BROWSER_SIZE:1920x1080}
